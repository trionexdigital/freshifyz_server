# Run on the same Linux VPS as PostgreSQL. Native Windows uses the SSH tunnel.
name: freshifyz
services:
  app:
    build: .
    container_name: freshifyz-server
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PGHOST: 127.0.0.1
      PGPORT: "55432"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
